name: HyperOS Telegram Auto-Poster

on:
  schedule:
    - cron: '*/20 * * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Telethon Diagnostic Test
        run: |
          python test_telethon_upload.py || true
          cat telethon_test_result.txt || true

      - name: Commit Diagnostics Result
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add telethon_test_result.txt || true
          git commit -m "Telethon diagnostics: $(date)" || echo "No changes"
          git push origin main || echo "Push failed"
