name: HyperOS Telegram Auto-Poster

on:
  schedule:
    # Runs every 20 minutes automatically
    - cron: '*/20 * * * *'
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run HyperOS Updater Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
          CHECK_INTERVAL: 0
        run: |
          python main.py --once

      - name: Print Execution Logs
        if: always()
        run: |
          if [ -f bot.log ]; then
            echo "### Execution Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat bot.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit and save posted database
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add database.json
          git commit -m "Update database: $(date)" || echo "No new posts to commit"
          git push || echo "No changes to push"
